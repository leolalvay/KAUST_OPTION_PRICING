name: KAUST
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.11

  # Scientific computing
  - numpy>=1.24
  - scipy>=1.10
  - pandas>=2.0

  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.12
  - plotly>=5.14

  # Jupyter
  - jupyter>=1.0
  - ipywidgets>=8.0
  - notebook
  - jupyterlab

  # Performance & optimisation
  - numba>=0.57
  - jax>=0.4.13
  - jaxlib>=0.4.13

  # Symbolic mathematics
  - sympy>=1.12

  # Machine learning (optional)
  - scikit-learn>=1.3

  # Progress bars
  - tqdm>=4.65

  # Additional utilities
  - pip

  # Optional pip packages
  - pip:
    - kaleido  # For plotly static image export
